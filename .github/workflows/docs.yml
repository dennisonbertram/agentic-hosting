name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'website/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'skills/**'
      - '.github/workflows/docs.yml'
      - 'scripts/assemble-github-pages.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install and build docs
        working-directory: docs-site
        env:
          ASTRO_BASE: /docs/
          ASTRO_SITE: https://agentic.hosting
        run: |
          npm ci
          npm run build
      - name: Assemble Pages artifact
        run: scripts/assemble-github-pages.sh pages-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
