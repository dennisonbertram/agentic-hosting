# systemd drop-in for ah.service: sandbox egress firewall (opt-in).
#
# Install as /etc/systemd/system/ah.service.d/sandbox-egress.conf, together
# with /usr/local/sbin/ah-sandbox-egress-firewall (a copy of
# docs/ops/sandbox-egress-firewall.sh). See docs/runbooks/sandboxes-hardening.md.
#
# ah runs unprivileged and cannot read iptables, so before each start, as root
# ("+"), this (re)installs the egress rules and writes the snapshot ah checks.
# "-" keeps ah starting if a step fails: ah then finds the rules missing in
# the snapshot and leaves sandbox egress disabled (403) with a loud warning.
# ah then also deletes any egress sandbox left from an earlier run. install
# rebuilds behind temporary drops, so running egress sandboxes are never
# unfiltered, and a failed install leaves the bridge blocked.
# --no-persist is safe across reboots: egress sandbox containers have Docker
# restart policy "no", so none runs before this drop-in has reinstalled the
# rules.
# Keep --bridge equal to AH_SANDBOX_EGRESS_NETWORK in /etc/default/ah.
[Service]
# Drop the previous snapshot first so a failed snapshot step cannot leave an
# older one for ah to trust.
ExecStartPre=+/bin/rm -f /run/ah-sandbox-egress/firewall.rules
ExecStartPre=-+/usr/local/sbin/ah-sandbox-egress-firewall install --bridge ah-sbx-egress --no-persist
ExecStartPre=-+/usr/local/sbin/ah-sandbox-egress-firewall snapshot /run/ah-sandbox-egress/firewall.rules --bridge ah-sbx-egress
