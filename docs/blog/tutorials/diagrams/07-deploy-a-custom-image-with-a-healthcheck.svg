<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#fafaf9"/>
  <text x="60" y="64" font-size="28" font-weight="700" fill="#1c1917">Build, push, deploy, then let ah restart hung containers</text>
  <text x="60" y="94" font-size="18" fill="#57534e">Build path (top), failure timeline (bottom)</text>

  <rect x="60" y="130" width="300" height="90" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="210" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#1c1917">docker build</text>
  <text x="210" y="196" font-size="18" text-anchor="middle" fill="#57534e">Dockerfile + HEALTHCHECK</text>

  <rect x="450" y="130" width="300" height="90" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="600" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#1c1917">docker push</text>
  <text x="600" y="196" font-size="18" text-anchor="middle" fill="#57534e">127.0.0.1:5000/ah/...</text>

  <rect x="840" y="130" width="300" height="90" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="990" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#fafaf9">POST /v1/services</text>
  <text x="990" y="196" font-size="18" text-anchor="middle" fill="#fafaf9">"image": "127.0.0.1:5000/..."</text>

  <line x1="360" y1="175" x2="446" y2="175" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <line x1="750" y1="175" x2="836" y2="175" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>

  <line x1="60" y1="330" x2="1140" y2="330" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="60" y="390" width="190" height="110" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="155" y="436" font-size="20" font-weight="600" text-anchor="middle" fill="#1c1917">healthy</text>
  <text x="155" y="464" font-size="18" text-anchor="middle" fill="#57534e">status: running</text>

  <rect x="300" y="390" width="190" height="110" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="395" y="426" font-size="20" font-weight="600" text-anchor="middle" fill="#1c1917">HEALTHCHECK</text>
  <text x="395" y="454" font-size="18" text-anchor="middle" fill="#57534e">fails, retries</text>
  <text x="395" y="478" font-size="18" text-anchor="middle" fill="#57534e">times in a row</text>

  <rect x="540" y="390" width="190" height="110" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="635" y="436" font-size="20" font-weight="600" text-anchor="middle" fill="#1c1917">unhealthy</text>
  <text x="635" y="464" font-size="18" text-anchor="middle" fill="#57534e">reported by Docker</text>

  <rect x="780" y="390" width="190" height="110" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="875" y="426" font-size="20" font-weight="600" text-anchor="middle" fill="#fafaf9">reconciler tick</text>
  <text x="875" y="454" font-size="18" text-anchor="middle" fill="#fafaf9">every 30s: restart,</text>
  <text x="875" y="478" font-size="18" text-anchor="middle" fill="#fafaf9">crash_count + 1</text>

  <rect x="1010" y="390" width="140" height="110" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="1080" y="426" font-size="20" font-weight="600" text-anchor="middle" fill="#fafaf9">breaker</text>
  <text x="1080" y="454" font-size="18" text-anchor="middle" fill="#fafaf9">5 in 600s:</text>
  <text x="1080" y="478" font-size="18" text-anchor="middle" fill="#fafaf9">circuit_open</text>

  <line x1="250" y1="445" x2="296" y2="445" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="445" x2="536" y2="445" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <line x1="730" y1="445" x2="776" y2="445" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <line x1="970" y1="445" x2="1006" y2="445" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>

  <text x="60" y="580" font-size="18" fill="#57534e">Docker runs the check; ah does not add one. A restart that passes the check returns the service to running.</text>
  <text x="60" y="608" font-size="18" fill="#57534e">Each unhealthy restart still counts as a crash.</text>
</svg>
