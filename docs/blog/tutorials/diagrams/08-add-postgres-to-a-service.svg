<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker></defs>
<rect width="1200" height="675" fill="#fafaf9"/>
<line x1="160" y1="95" x2="160" y2="598" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="60" y="25" width="200" height="70" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
<text x="160" y="67" text-anchor="middle" font-size="20" font-weight="600" fill="#fafaf9">Agent / ahc</text>
<line x1="470" y1="95" x2="470" y2="598" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="370" y="25" width="200" height="70" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
<text x="470" y="55" text-anchor="middle" font-size="20" font-weight="600" fill="#fafaf9">ah API</text><text x="470" y="80" text-anchor="middle" font-size="18" fill="#fafaf9">SQLite</text>
<line x1="780" y1="95" x2="780" y2="598" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="680" y="25" width="200" height="70" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
<text x="780" y="55" text-anchor="middle" font-size="20" font-weight="600" fill="#fafaf9">Docker</text><text x="780" y="80" text-anchor="middle" font-size="18" fill="#fafaf9">gVisor (runsc)</text>
<line x1="1050" y1="95" x2="1050" y2="598" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="950" y="25" width="200" height="70" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
<text x="1050" y="67" text-anchor="middle" font-size="20" font-weight="600" fill="#fafaf9">Service container</text>
<line x1="168" y1="135" x2="462" y2="135" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="315" y="126" text-anchor="middle" font-size="18" fill="#1c1917">1 POST /v1/databases</text>
<line x1="478" y1="190" x2="772" y2="190" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="625" y="181" text-anchor="middle" font-size="18" fill="#1c1917">2 run postgres, volume ah-db-*</text>
<line x1="478" y1="245" x2="772" y2="245" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="625" y="236" text-anchor="middle" font-size="18" fill="#1c1917">3 readiness probe (protocol)</text>
<rect x="320" y="268" width="300" height="42" rx="10" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/><text x="470" y="295" text-anchor="middle" font-size="18" fill="#1c1917">4 AES-256-GCM, store in SQLite</text>
<line x1="168" y1="350" x2="462" y2="350" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="315" y="341" text-anchor="middle" font-size="18" fill="#1c1917">5 GET /connection-string</text>
<line x1="168" y1="405" x2="462" y2="405" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="315" y="396" text-anchor="middle" font-size="18" fill="#1c1917">6 POST /v1/services/{id}/env</text>
<line x1="168" y1="460" x2="462" y2="460" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="315" y="451" text-anchor="middle" font-size="18" fill="#1c1917">7 POST /v1/services/{id}/restart</text>
<line x1="478" y1="515" x2="772" y2="515" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="625" y="506" text-anchor="middle" font-size="18" fill="#1c1917">8 recreate container, new env</text>
<line x1="788" y1="570" x2="1042" y2="570" stroke="#1c1917" stroke-width="2" marker-end="url(#ar)"/>
<text x="915" y="561" text-anchor="middle" font-size="18" fill="#1c1917">9 start with new env</text>
<text x="600" y="645" text-anchor="middle" font-size="18" fill="#57534e">Create returns the connection string; later reads decrypt it and are audit-logged.</text>
</svg>