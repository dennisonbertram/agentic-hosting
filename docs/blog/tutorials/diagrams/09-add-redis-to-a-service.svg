<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1917"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57534e"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#fafaf9"/>
  <text x="60" y="64" font-size="28" font-weight="700" fill="#1c1917">Redis next to a service on agentic-hosting</text>
  <text x="60" y="96" font-size="18" fill="#57534e">What the code does: the REDIS_URL points at a loopback port on the host</text>

  <!-- ah -->
  <rect x="60" y="150" width="300" height="130" rx="14" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="210" y="205" font-size="24" font-weight="700" fill="#fafaf9" text-anchor="middle">ah</text>
  <text x="210" y="238" font-size="18" fill="#fafaf9" text-anchor="middle">internal/databases</text>
  <text x="210" y="262" font-size="18" fill="#fafaf9" text-anchor="middle">POST /v1/databases</text>

  <!-- service_env -->
  <rect x="60" y="440" width="300" height="110" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="210" y="488" font-size="22" font-weight="700" fill="#1c1917" text-anchor="middle">service_env</text>
  <text x="210" y="518" font-size="18" fill="#57534e" text-anchor="middle">REDIS_URL, AES-256-GCM</text>

  <!-- app -->
  <rect x="470" y="410" width="300" height="140" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="620" y="458" font-size="22" font-weight="700" fill="#1c1917" text-anchor="middle">my-app container</text>
  <text x="620" y="490" font-size="18" fill="#57534e" text-anchor="middle">tenant bridge network</text>
  <text x="620" y="516" font-size="18" fill="#57534e" text-anchor="middle">ah-tenant-&lt;tenant id&gt;</text>

  <!-- redis -->
  <rect x="860" y="150" width="280" height="130" rx="14" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="1000" y="200" font-size="24" font-weight="700" fill="#fafaf9" text-anchor="middle">redis:7-alpine</text>
  <text x="1000" y="234" font-size="18" fill="#fafaf9" text-anchor="middle">--requirepass, runsc</text>
  <text x="1000" y="260" font-size="18" fill="#fafaf9" text-anchor="middle">127.0.0.1:&lt;port&gt; on host</text>

  <!-- volume -->
  <rect x="860" y="400" width="280" height="150" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1000" y="446" font-size="22" font-weight="700" fill="#1c1917" text-anchor="middle">ah-db-&lt;id&gt; volume</text>
  <text x="1000" y="482" font-size="18" fill="#57534e" text-anchor="middle">survives restart</text>
  <text x="1000" y="508" font-size="18" fill="#57534e" text-anchor="middle">wiped on DELETE</text>

  <!-- arrows -->
  <line x1="360" y1="215" x2="858" y2="215" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="198" font-size="18" fill="#1c1917" text-anchor="middle">AUTH + PING readiness probe</text>

  <line x1="360" y1="495" x2="468" y2="495" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <text x="414" y="578" font-size="18" fill="#1c1917" text-anchor="middle">REDIS_URL injected at</text>
  <text x="414" y="601" font-size="18" fill="#1c1917" text-anchor="middle">container create</text>

  <line x1="210" y1="282" x2="210" y2="438" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <text x="222" y="365" font-size="18" fill="#1c1917">stores connection string</text>

  <line x1="1000" y1="282" x2="1000" y2="398" stroke="#57534e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="1012" y="345" font-size="18" fill="#57534e">mounted at /data</text>

  <path d="M770 450 C 820 450, 820 330, 858 270" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#g)"/>
  <text x="640" y="345" font-size="18" fill="#57534e" text-anchor="middle">REDIS_URL = redis://:***@127.0.0.1:port</text>
  <text x="640" y="371" font-size="18" fill="#57534e" text-anchor="middle">reachability from this container: unverified</text>

  <text x="60" y="650" font-size="18" fill="#57534e">Sources: internal/databases/databases.go, internal/docker/client.go, internal/api/services.go</text>
</svg>
