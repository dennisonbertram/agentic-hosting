<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker></defs>
<rect width="1200" height="675" fill="#fafaf9"/>
<text x="60" y="64" font-size="30" font-weight="700" fill="#1c1917">How a service env var is stored and read</text>
<g stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M240 200 H290"/><path d="M510 200 H560"/><path d="M800 200 H850"/>
<path d="M960 240 V330 H800 V380" /><path d="M960 240 V330 H1060 V380"/>
<path d="M600 450 V520" stroke-dasharray="6 5"/>
</g>
<g stroke-width="2">
<rect x="40" y="150" width="200" height="100" rx="12" fill="#fafaf9" stroke="#1c1917"/>
<rect x="290" y="150" width="220" height="100" rx="12" fill="#1c1917" stroke="#1c1917"/>
<rect x="560" y="150" width="240" height="100" rx="12" fill="#1c1917" stroke="#1c1917"/>
<rect x="850" y="150" width="220" height="100" rx="12" fill="#fafaf9" stroke="#1c1917"/>
<rect x="640" y="380" width="320" height="70" rx="12" fill="#fafaf9" stroke="#1c1917"/>
<rect x="990" y="380" width="170" height="70" rx="12" fill="#fafaf9" stroke="#1c1917"/>
<rect x="340" y="520" width="520" height="80" rx="12" fill="#1c1917" stroke="#1c1917"/>
</g>
<g font-size="20" text-anchor="middle" fill="#1c1917">
<text x="140" y="196" font-weight="600">Client JSON</text><text x="140" y="224" fill="#57534e">POST .../env</text>
<text x="400" y="190" font-weight="600" fill="#fafaf9">ValidateEnvVars</text><text x="400" y="218" fill="#fafaf9">key regex, 32 KiB,</text><text x="400" y="240" fill="#fafaf9" font-size="18">null bytes, denylist</text>
<text x="680" y="196" font-weight="600" fill="#fafaf9">AES-256-GCM</text><text x="680" y="224" fill="#fafaf9">key: master.key</text>
<text x="960" y="196" font-weight="600">service_env</text><text x="960" y="224" fill="#57534e">value_encrypted</text>
<text x="800" y="410" font-weight="600">GET .../env</text><text x="800" y="436" fill="#57534e">masked (default)</text>
<text x="1075" y="410" font-weight="600">?reveal=true</text><text x="1075" y="436" fill="#57534e" font-size="18">decrypt + AUDIT</text>
<text x="600" y="555" font-weight="600" fill="#fafaf9">POST .../restart</text><text x="600" y="583" fill="#fafaf9">container recreated, env injected</text>
</g>
<text x="620" y="500" font-size="18" fill="#57534e">changes apply only here</text>
</svg>
