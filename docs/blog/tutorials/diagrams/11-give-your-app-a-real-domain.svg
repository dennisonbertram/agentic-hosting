<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1917"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#fafaf9"/>
  <text x="40" y="58" font-size="28" font-weight="600" fill="#1c1917">From browser to container</text>

  <rect x="40" y="110" width="200" height="90" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="140" y="150" font-size="20" text-anchor="middle" fill="#1c1917">Browser</text>
  <text x="140" y="176" font-size="18" text-anchor="middle" fill="#57534e">my-app.apps…</text>

  <rect x="300" y="110" width="300" height="90" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="450" y="150" font-size="20" text-anchor="middle" fill="#1c1917">*.apps.example.com</text>
  <text x="450" y="176" font-size="18" text-anchor="middle" fill="#57534e">A record to server IP</text>

  <rect x="660" y="110" width="220" height="90" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="770" y="150" font-size="20" text-anchor="middle" fill="#fafaf9">Traefik</text>
  <text x="770" y="176" font-size="18" text-anchor="middle" fill="#fafaf9">:443 websecure</text>

  <rect x="940" y="110" width="220" height="90" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="1050" y="150" font-size="20" text-anchor="middle" fill="#1c1917">Ingress network</text>
  <text x="1050" y="176" font-size="18" text-anchor="middle" fill="#57534e">one per service</text>

  <rect x="940" y="300" width="220" height="90" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="1050" y="340" font-size="20" text-anchor="middle" fill="#fafaf9">Your container</text>
  <text x="1050" y="366" font-size="18" text-anchor="middle" fill="#fafaf9">listening on :port</text>

  <path d="M240 155H298" stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M600 155H658" stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 155H938" stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1050 200V298" stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="60" y="320" width="400" height="100" rx="12" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="260" y="360" font-size="20" text-anchor="middle" fill="#1c1917">Route file written by ah</text>
  <text x="260" y="390" font-size="18" text-anchor="middle" fill="#57534e">/etc/traefik/dynamic/&lt;serviceID&gt;.yml</text>

  <rect x="60" y="470" width="400" height="100" rx="12" fill="#fafaf9" stroke="#57534e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="260" y="510" font-size="20" text-anchor="middle" fill="#1c1917">Route file you write</text>
  <text x="260" y="540" font-size="18" text-anchor="middle" fill="#57534e">/etc/traefik/dynamic/myapp.yml</text>

  <path d="M460 370H770V202" stroke="#1c1917" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M460 520H840V202" stroke="#57534e" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>

  <text x="500" y="440" font-size="18" fill="#57534e">Router rule in each file:</text>
  <text x="500" y="468" font-size="18" fill="#1c1917">Host(`my-app.apps.example.com`)</text>

  <text x="40" y="630" font-size="18" fill="#57534e">Solid: ah writes it when the service deploys. Dashed: you write it for any other hostname.</text>
</svg>
