<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#fafaf9"/>
  <text x="60" y="64" font-size="30" font-weight="700" fill="#1c1917">The dashboard is a static page that calls your API</text>
  <text x="60" y="98" font-size="20" fill="#57534e">Polled every 20 seconds, with the key in the Authorization header</text>

  <rect x="60" y="150" width="300" height="190" rx="14" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="90" y="200" font-size="24" font-weight="700" fill="#fafaf9">Browser</text>
  <text x="90" y="238" font-size="20" fill="#fafaf9">website/dashboard/</text>
  <text x="90" y="268" font-size="20" fill="#fafaf9">index.html + app.js</text>
  <text x="90" y="310" font-size="18" fill="#fafaf9">key in localStorage</text>

  <line x1="360" y1="245" x2="440" y2="245" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  <text x="372" y="222" font-size="18" fill="#57534e">HTTPS</text>
  <text x="372" y="278" font-size="18" fill="#57534e">Bearer</text>
  <text x="372" y="300" font-size="18" fill="#57534e">+ Origin</text>

  <rect x="440" y="150" width="300" height="190" rx="14" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="470" y="200" font-size="24" font-weight="700" fill="#fafaf9">CORS middleware</text>
  <text x="470" y="238" font-size="20" fill="#fafaf9">exact-origin allowlist</text>
  <text x="470" y="268" font-size="20" fill="#fafaf9">OPTIONS answered</text>
  <text x="470" y="298" font-size="20" fill="#fafaf9">before auth (204)</text>

  <line x1="740" y1="245" x2="820" y2="245" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>

  <rect x="820" y="150" width="320" height="190" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="2"/>
  <text x="850" y="200" font-size="24" font-weight="700" fill="#1c1917">/v1 endpoints</text>
  <text x="850" y="238" font-size="20" fill="#1c1917">auth, then handlers</text>
  <text x="850" y="268" font-size="20" fill="#57534e">same API agents use</text>

  <rect x="60" y="390" width="500" height="240" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="1.5"/>
  <text x="85" y="430" font-size="22" font-weight="700" fill="#1c1917">8 endpoints it polls</text>
  <g font-size="18" fill="#1c1917" font-family="ui-monospace, Menlo, monospace">
    <text x="85" y="466">/v1/system/health/detailed</text>
    <text x="85" y="494">/v1/services</text>
    <text x="85" y="522">/v1/builds?limit=100</text>
    <text x="85" y="550">/v1/databases</text>
    <text x="320" y="494">/v1/tenant</text>
    <text x="320" y="522">/v1/tenant/usage</text>
    <text x="320" y="550">/v1/auth/keys</text>
    <text x="85" y="578">/v1/activity?limit=100</text>
  </g>
  <text x="85" y="612" font-size="18" fill="#57534e">Logs and env load on demand per service</text>

  <rect x="620" y="390" width="520" height="240" rx="14" fill="#fafaf9" stroke="#1c1917" stroke-width="1.5"/>
  <text x="645" y="430" font-size="22" font-weight="700" fill="#1c1917">Default allowlist (AH_CORS_ORIGINS)</text>
  <g font-size="18" fill="#1c1917" font-family="ui-monospace, Menlo, monospace">
    <text x="645" y="468">https://agentic.hosting</text>
    <text x="645" y="496">https://www.agentic.hosting</text>
    <text x="645" y="524">https://dennisonbertram.github.io</text>
  </g>
  <text x="645" y="562" font-size="18" fill="#57534e">"*" is dropped. No credentials sent.</text>
  <text x="645" y="590" font-size="18" fill="#57534e">Other dashboard hosts must be added.</text>
</svg>
