worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/nginx_access.log;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;

    # Apex https://agentic.hosting is GitHub Pages after DNS cutover.
    # www stays on this Hetzner container (TLS is terminated by Traefik).
    server {
        listen 80;
        server_name www.agentic.hosting;

        location / {
            return 301 https://github.com/dennisonbertram/agentic-hosting;
        }
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /changelog {
            return 301 /changelog/;
        }

        location = /docs {
            return 301 /docs/;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
